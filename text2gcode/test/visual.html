<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Text2GCode — visual test cases</title>
<style>
  body { background: #160f2b; color: #ece7f8; font: 14px/1.5 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 24px; }
  h1 { color: #a78bfa; font-size: 18px; margin: 0 0 6px; }
  p.dim { color: #8b7bb8; font-size: 13px; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
  .case { background: #1d1538; border: 1px solid #3b2d6e; border-radius: 12px; padding: 12px 14px; }
  .case h2 { font-size: 13px; color: #c4b5fd; margin: 0 0 8px; font-weight: 600; }
  .case canvas { width: 100%; height: 260px; display: block; background: #150f2b; border-radius: 8px; }
  .case .meta { font: 11px Menlo, monospace; color: #8b7bb8; margin-top: 6px; }
  .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: middle; }
</style>
</head>
<body>
<h1>Text2GCode — visual test cases</h1>
<p class="dim">Dim gray = glyph contours (flat). Bright = generated toolpaths.
<span class="sw" style="background:#e879f9"></span>cut
<span class="sw" style="background:#a78bfa"></span>rapid
— grid: 5 mm major.</p>
<div class="grid" id="grid"></div>

<script src="../vendor/opentype.min.js"></script>
<script src="../vendor/polybool.min.js"></script>
<script src="../vendor/clipper.min.js"></script>
<script src="../js/hershey_fonts.js"></script>
<script src="../js/toolpath.js"></script>
<script>
const CASES = [
  { title: 'O — boss ⌀3, grow (outer +1.5, hole −1.5)', font: 'Roboto-Regular.ttf', text: 'O', size: 30, mode: 'boss', tool: { diameter: 3, compensation: 'grow' } },
  { title: 'O — pocket ⌀2, 50% stepover, hatch 0°', font: 'Roboto-Regular.ttf', text: 'O', size: 30, mode: 'pocket', tool: { diameter: 2, contourPass: true, stepoverPct: 50, hatchAngle: 0 } },
  { title: 'K — V-bit full ⌀6', font: 'Roboto-Regular.ttf', text: 'K', size: 30, mode: 'vbit', tool: { diameter: 6, vbitAngle: 60 } },
  { title: 'wow — thin bosses ⌀3 grow (inversion stress)', font: 'Roboto-Regular.ttf', text: 'wow', size: 26, mode: 'boss', tool: { diameter: 3, compensation: 'grow' } },
  { title: 'H — pocket ⌀2, holes, hatch 45°', font: 'Roboto-Regular.ttf', text: 'H', size: 30, mode: 'pocket', tool: { diameter: 2, contourPass: true, stepoverPct: 50, hatchAngle: 45 } },
  { title: 'P — pocket ⌀2, hatch only (no contour pass)', font: 'Roboto-Regular.ttf', text: 'P', size: 30, mode: 'pocket', tool: { diameter: 2, contourPass: false, stepoverPct: 50, hatchAngle: 45 } },
];

async function run() {
  const grid = document.getElementById('grid');
  for (const c of CASES) {
    const buf = await (await fetch('../fonts/' + c.font)).arrayBuffer();
    const font = opentype.parse(buf);
    let flat = T.normalize(T.buildOpenTypeContours(font, c.text, { size: c.size }), 'left');
    let u = T.unionContours(flat, { tol: 0.04 });
    const paths = T.buildCutPaths(u, c.mode, c.tool);

    const card = document.createElement('div');
    card.className = 'case';
    card.innerHTML = '<h2>' + c.title + '</h2><canvas></canvas><div class="meta"></div>';
    grid.appendChild(card);
    const canvas = card.querySelector('canvas');
    const meta = card.querySelector('.meta');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const b = T.bounds(paths.length ? paths.map(q => ({ pts: q })) : [{ pts: [0, 0] }]);
    const pad = 30;
    const sc = Math.min((W - pad * 2) / Math.max(1e-6, b.width), (H - pad * 2) / Math.max(1e-6, b.height));
    const cx = W / 2 - (b.minX + b.maxX) / 2 * sc;
    const cy = H / 2 + (b.minY + b.maxY) / 2 * sc;
    const X = (x, y) => (cx + x * sc).toFixed(1) + ',' + (cy - y * sc).toFixed(1);

    // grid 5mm
    ctx.strokeStyle = 'rgba(139,92,246,.10)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let gx = Math.floor(b.minX / 5) * 5; gx <= b.maxX + 5; gx += 5) { ctx.moveTo.apply(ctx, X(gx, b.minY - 5).split(',')); ctx.lineTo.apply(ctx, X(gx, b.maxY + 5).split(',')); }
    for (let gy = Math.floor(b.minY / 5) * 5; gy <= b.maxY + 5; gy += 5) { ctx.moveTo.apply(ctx, X(b.minX - 5, gy).split(',')); ctx.lineTo.apply(ctx, X(b.maxX + 5, gy).split(',')); }
    ctx.stroke();

    // dim glyph contours
    ctx.strokeStyle = 'rgba(140,130,180,.35)'; ctx.lineWidth = 1;
    for (const q of flat) { ctx.beginPath(); q.pts.forEach((p, i) => i ? ctx.lineTo(cx + p[0] * sc, cy - p[1] * sc) : ctx.moveTo(cx + p[0] * sc, cy - p[1] * sc)); ctx.stroke(); }

    // toolpaths
    const cols = ['#e879f9', '#c084fc', '#a78bfa', '#7dd3fc', '#fb7185', '#34d399', '#fde047'];
    paths.forEach((q, j) => {
      ctx.strokeStyle = cols[j % cols.length]; ctx.lineWidth = 1.6; ctx.beginPath();
      q.forEach((p, i) => i ? ctx.lineTo(cx + p[0] * sc, cy - p[1] * sc) : ctx.moveTo(cx + p[0] * sc, cy - p[1] * sc));
      ctx.stroke();
    });

    meta.innerHTML = 'paths ' + paths.length + ' · bounds ' + b.minX.toFixed(1) + ',' + b.minY.toFixed(1) + ' → ' + b.maxX.toFixed(1) + ',' + b.maxY.toFixed(1) + ' mm';
  }
  document.body.insertAdjacentHTML('beforeend', '<p class="dim" style="margin-top:16px">All cases generated with the real engine (toolpath.js) in your browser — nothing pre-rendered.</p>');
}
run().catch(e => { document.body.innerHTML += '<p style="color:#f0abfc">Error: ' + e.message + '</p>'; });
</script>
</body>
</html>
